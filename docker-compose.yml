services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - app-network

  cpa-backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root_password}@db:3306/cpa_yearly_report
      PORT: 3001
    depends_on:
      - db
    networks:
      - app-network

  cpa-frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - cpa-backend
    networks:
      - app-network

networks:
  app-network:

volumes:
  db_data:
